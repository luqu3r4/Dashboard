services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - dataprotection-keys:/keys
      # ":ro" = read-only: el contenedor puede leer esas rutas del host pero no modificarlas.
      # Se montan bajo /host/* porque el /proc y /sys propios del contenedor solo muestran
      # el contenedor; para medir la máquina real hay que leer los del host.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # "/" se monta únicamente para medir el uso de disco.
      - /:/host/root:ro
    environment:
      # Idioma/formato regional español (números, fechas) dentro del contenedor.
      - LANG=es_ES.UTF-8
      # Las variables "Sistema__X" (doble guion bajo) sobrescriben la clave "Sistema:X"
      # de la configuración de la aplicación.
      - Sistema__ProcPath=/host/proc
      - Sistema__SysPath=/host/sys
      - Sistema__DiskPath=/host/root
      # URL desde donde el dashboard consulta los contenedores Docker. Usa el nombre del
      # servicio "docker-proxy" como nombre de host: Compose crea una red interna y cada
      # servicio se puede alcanzar por su nombre. Si se deja vacía, la sección de
      # contenedores queda desactivada.
      - Sistema__DockerApiUrl=http://docker-proxy:2375
    # "depends_on" controla el orden de arranque: Compose inicia primero docker-proxy y
    # después dashboard. OJO: solo espera a que el contenedor se haya arrancado, no a que
    # el proxy esté listo para responder.
    depends_on:
      - docker-proxy
    restart: unless-stopped

  # Proxy de solo lectura hacia la API de Docker. En vez de darle al dashboard el socket
  # de Docker (que permitiría crear, parar o borrar contenedores), solo este servicio lo
  # toca y filtra las peticiones: el dashboard únicamente puede hacer consultas.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    environment:
      # CONTAINERS=1 permite solo peticiones GET sobre contenedores (lista, detalle,
      # estadísticas, logs...; el detalle incluye las variables de entorno de cada
      # contenedor). Cualquier escritura (POST/DELETE...) y las demás secciones (imágenes,
      # redes, volúmenes...) devuelven 403; ping, version y events quedan permitidos por
      # defecto.
      - CONTAINERS=1
      # El proxy (HAProxy) registra por defecto una línea por cada petición, y el dashboard
      # hace varias cada 2 segundos: llenaría el disco poco a poco. Con "warning" solo
      # se registran los avisos y errores.
      - LOG_LEVEL=warning
    volumes:
      # El socket de Docker es el "mando a distancia" del motor de Docker en el host.
      # OJO: ":ro" no protege nada aquí: quien puede hablar con el socket controla Docker.
      # La protección real es el filtrado del proxy (por eso el dashboard no monta el socket).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Docker guarda los logs de cada contenedor en un fichero que por defecto nunca se
    # rota y crece sin límite. Así se conservan como máximo 3 ficheros de 10 MB.
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # No lleva "ports": no se publica ningún puerto hacia la máquina. Solo es accesible
    # desde la red interna de Compose (por los demás servicios), no desde fuera.
    restart: unless-stopped

volumes:
  dataprotection-keys:
